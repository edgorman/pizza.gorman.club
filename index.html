<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ed's slice of life</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🍕 ed's slice of life</h1>
    <p>A running log of London pizza, rated on the NICE system.</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="visited">Been there</button>
    <button class="tab-btn" data-tab="wishlist">Want to go</button>
  </div>

  <div class="controls">
    <input id="search" type="search" placeholder="Search visited pizzerias…" />
    <span id="count" class="count"></span>
  </div>

  <main id="main"></main>

  <footer>
    Data lives in <a href="pizzas.json">pizzas.json</a> — edit it to add new places.
  </footer>

  <script src="app.js"></script>
</body>
</html>
