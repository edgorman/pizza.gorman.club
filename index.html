<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ed's slice of life</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <header class="bar">
    <h1 class="brand">ed's <em>slice</em> of life</h1>
    <div class="count" id="count"></div>
  </header>

  <nav class="filters" id="filters" aria-label="filter pizza spots">
    <button type="button" data-f="all" aria-pressed="true">everything</button>
    <button type="button" data-f="eaten" aria-pressed="false"><i class="swatch eaten"></i>eaten</button>
    <button type="button" data-f="totry" aria-pressed="false"><i class="swatch totry"></i>to try</button>
  </nav>

  <div class="geo-hint" id="geoHint" hidden></div>

  <section id="panel" role="dialog" aria-modal="false" aria-label="pizza spot details"></section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
