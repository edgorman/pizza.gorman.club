n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<style>/* required styles */\r\n\r\n.leaflet-pane,\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow,\r\n.leaflet-tile-container,\r\n.leaflet-pane > svg,\r\n.leaflet-pane > canvas,\r\n.leaflet-zoom-box,\r\n.leaflet-image-layer,\r\n.leaflet-layer {\r\n\tposition: absolute;\r\n\tleft: 0;\r\n\ttop: 0;\r\n\t}\r\n.leaflet-container {\r\n\toverflow: hidden;\r\n\t}\r\n.leaflet-tile,\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\t-webkit-user-select: none;\r\n\t   -moz-user-select: none;\r\n\t        user-select: none;\r\n\t  -webkit-user-drag: none;\r\n\t}\r\n/* Prevents IE11 from highlighting tiles in blue */\r\n.leaflet-tile::selection {\r\n\tbackground: transparent;\r\n}\r\n/* Safari renders non-retina tile on retina better with this, but Chrome is worse */\r\n.leaflet-safari .leaflet-tile {\r\n\timage-rendering: -webkit-optimize-contrast;\r\n\t}\r\n/* hack that prevents hw layers \"stretching\" when loading new tiles */\r\n.leaflet-safari .leaflet-tile-container {\r\n\twidth: 1600px;\r\n\theight: 1600px;\r\n\t-webkit-transform-origin: 0 0;\r\n\t}\r\n.leaflet-marker-icon,\r\n.leaflet-marker-shadow {\r\n\tdisplay: block;\r\n\t}\r\n/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */\r\n/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */\r\n.leaflet-container .leaflet-overlay-pane svg {\r\n\tmax-width: none !important;\r\n\tmax-height: none !important;\r\n\t}\r\n.leaflet-container .leaflet-marker-pane img,\r\n.leaflet-container .leaflet-shadow-pane img,\r\n.leaflet-container .leaflet-tile-pane img,\r\n.leaflet-container img.leaflet-image-layer,\r\n.leaflet-container .leaflet-tile {\r\n\tmax-width: none !important;\r\n\tmax-height: none !important;\r\n\twidth: auto;\r\n\tpadding: 0;\r\n\t}\r\n\r\n.leaflet-container img.leaflet-tile {\r\n\t/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */\r\n\tmix-blend-mode =\"true\"] .swatch.totry { background: transparent; border-color: var(--color-bg); }\n\n  /* ── pins ─────────────────────────────────────────────────── */\n  .pin { position: relative; }\n  .pin .stem {\n    position: absolute; left: 50%; bottom: 0; width: 3px; height: 12px;\n    margin-left: -1.5px; background: var(--color-text);\n  }\n  .pin .dot {\n    position: absolute; left: 0; top: 0; width: 36px; height: 36px;\n    display: grid; place-items: center; border-radius: 50%;\n    border: 3px solid var(--color-text);\n    font-family: var(--font-heading); font-size: 13px; line-height: 1;\n    transition: transform 0.18s cubic-bezier(0.34, 1.7, 0.64, 1), box-shadow 0.18s;\n    transform-origin: 50% 100%;\n  }\n  .pin.eaten .dot { background: var(--color-accent); color: var(--color-bg); box-shadow: 2px 2px 0 var(--color-text); }\n  .pin.totry .dot {\n    background: var(--color-bg); color: var(--color-accent-2-700);\n    border-style: dashed; border-color: var(--color-accent-2-700);\n    box-shadow: 2px 2px 0 color-mix(in srgb, var(--color-text) 45%, transparent);\n  }\n  .pin:hover .dot { transform: scale(1.12); }\n  .pin.on .dot { transform: scale(1.22); box-shadow: 3px 3px 0 var(--color-text); }\n  .leaflet-marker-icon:focus-visible { outline: 3px solid var(--color-accent-700); outline-offset: 4px; border-radius: 50%; }\n\n  /* ── the panel ────────────────────────────────────────────── */\n  #panel {\n    position: fixed; z-index: 900; width: min(348px, calc(100vw - 24px));\n    background: var(--color-bg); border: 3px solid var(--color-text);\n    border-radius: 26px; box-shadow: 6px 6px 0 var(--color-text);\n    padding: var(--space-4) var(--space-4) var(--space-3);\n    opacity: 0; pointer-events: none; transform: scale(0.14);\n    transition: transform 0.28s cubic-bezier(0.3, 1.55, 0.55, 1), opacity 0.16s ease-out;\n  }\n  #panel.open { opacity: 1; pointer-events: auto; transform: scale(1); }\n  .p-top { display: flex; align-items: flex-start; gap: var(--sp gle.com/maps/search/?api=1&query=' + encodeURIComponent(s.name + ', ' + s.area + ', London');\n  const mapsBtn = '<a class=\"maps\" href=\"' + gmaps + '\" target=\"_blank\" rel=\"noopener\">google maps' +\n    '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17 17 7M9 7h8v8\"/><\u002Fsvg><\u002Fa>';\n\n  if (s.kind === 'totry') {\n    return close +\n      '<div class=\"p-top\"><div><div class=\"p-kick totry\">on the list<\u002Fdiv>' +\n      '<div class=\"p-name\">' + s.name + '<\u002Fdiv><div class=\"p-where\">' + s.area + ' · not been yet<\u002Fdiv><\u002Fdiv><\u002Fdiv>' +\n      '<p class=\"p-review\">' + s.note + '<\u002Fp>' +\n      '<div class=\"p-foot\"><div class=\"p-date\">unrated<\u002Fdiv>' + mapsBtn + '<\u002Fdiv>';\n  }\n\n  return close +\n    '<div class=\"p-top\"><div><div class=\"p-kick\">eaten &amp; rated<\u002Fdiv>' +\n    '<div class=\"p-name\">' + s.name + '<\u002Fdiv><div class=\"p-where\">' + s.area + '<\u002Fdiv><\u002Fdiv>' +\n    '<div class=\"score\">' + s.score.toFixed(1) + '<span>/10<\u002Fspan><\u002Fdiv><\u002Fdiv>' +\n    '<p class=\"p-review\">' + s.review + '<\u002Fp>' +\n    '<div class=\"nice\">' +\n      row('N', s.n, LADDERS.n) +\n      row('I', s.i, LADDERS.i) +\n      row('C', s.c, LADDERS.c) +\n      '<div class=\"row\"><div class=\"letter\">E<\u002Fdiv><div class=\"ed\"><span class=\"badge ' + (s.e ? 'yes' : 'no') + '\">' +\n        (s.e ? 'handshake secured' : 'no handshake') + '<\u002Fspan><\u002Fdiv><\u002Fdiv>' +\n    '<\u002Fdiv>' +\n    '<div class=\"key\"><b>N<\u002Fb> nice · <b>I<\u002Fb> italianness, innovativeness · <b>C<\u002Fb> cost, crust, cheese, company · ' +\n    '<b>E<\u002Fb> ed factor: did I shake a hand while holding a slice<\u002Fdiv>' +\n    '<div class=\"p-foot\"><div class=\"p-date\">' + s.date + '<\u002Fdiv>' + mapsBtn + '<\u002Fdiv>';\n}\n\nfunction place(s) {\n  const pt = map.latLngToContainerPoint(s.ll);\n  const rect = map.getContainer().getBoundingClientRect();\n  const px = rect.left + pt.x, py = rect.top + pt.y - 46; // top of the pin head\n  const vw = window.innerWidth, vh = window.innerHeight;\n  const w = panel.offsetWidth, h = panel.offsetHeight;\n\n  let x = Math.min(Math.max(12, px - w / 2), vw - w - 12);\n  let y = py - h - 16;\n  if (y < 74) y = Math.min(py + 60, vh - h - 96);\n  y = Math.max(y, 12);\n\n  panel.style.left = x + 'px';\n  panel.style.top = y + 'px';\n  panel.style.transformOrigin = (px - x) + 'px ' + (py - y) + 'px';\n}\n\nfunction openSpot(id) {\n  const s = SPOTS.find(v => v.id === id);\n  if (!s) return;\n  if (openId === id) { closePanel(); return; }\n  closePanel(true);\n  openId = id;\n  const p = pinEl(id); if (p) p.classList.add('on');\n  panel.innerHTML = panelHTML(s);\n  panel.classList.remove('open');\n  panel.style.visibility = 'hidden';\n\n  // nudge the map so the pin and its panel both fit, then pop out from the pin\n  const target = map.project(s.ll, map.getZoom());\n  const size = map.getSize();\n  const wantY = size.y * (window.innerHeight < 620 ? 0.62 : 0.66);\n  const center = map.unproject([target.x, target.y - (wantY - size.y / 2)], map.getZoom());\n  map.panTo(center, { animate: true, duration: 0.35 });\n\n  setTimeout(() => {\n    panel.style.visibility = '';\n    place(s);\n    requestAnimationFrame(() => panel.classList.add('open'));\n  }, 380);\n\n  document.getElementById('count').textContent = s.kind === 'eaten' ? 'rated ' + s.score.toFixed(1) + '/10' : 'not been yet';\n}\n\nfunction closePanel(silent) {\n  if (openId != null) { const p = pinEl(openId); if (p) p.classList.remove('on'); }\n  openId = null;\n  panel.classList.remove('open');\n  if (!silent) updateCount();\n}\n\ndocument.addEventListener('click', e => {\n  if (e.target.closest('#closeBtn')) { closePanel(); return; }\n  if (e.target.closest('#panel') || e.target.closest('.pin') || e.target.closest('.filters') || e.target.closest('.bar')) return;\n  closePanel();\n});\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });\nmap.on('movestart zoomstart', () => { if (panel.classList.contains('open')) closePanel(); });\nwindow.addEventListener('resize', () => closePanel());\n\n/* ── filtering ─────────────────────────────────────────────── */\nlet filter = 'all';\nconst buttons = [...document.querySelectorAll('#filters button')];\n\nfunction updateCount() {\n  const eaten = SPOTS.filter(s => s.kind === 'eaten').length;\n  const totry = SPOTS.length - eaten;\n  const el = document.getElementById('count');\n  el.textContent = filter === 'eaten' ? eaten + ' eaten'\n    : filter === 'totry' ? totry + ' to try'\n    : eaten + ' eaten · ' + totry + ' to try';\n}\n\nfunction applyFilter(f) {\n  filter = f;\n  buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));\n  SPOTS.forEach(s => {\n    const show = f === 'all' || s.kind === f;\n    const m = markers[s.id];\n    if (show && !map.hasLayer(m)) m.addTo(map);\n    if (!show && map.hasLayer(m)) map.removeLayer(m);\n  });\n  closePanel(true);\n  updateCount();\n}\n\nbuttons.forEach(b => b.addEventListener('click', () => applyFilter(b.dataset.f)));\nupdateCount();\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 0 0 .5px rgba(31,30,29,.14),0 2px 10px rgba(0,0,0,.09)}\n#__claude_design_branding *{box-sizing:border-box;margin:0}\n#__claude_design_branding a{color:inherit;text-decoration:none;display:
