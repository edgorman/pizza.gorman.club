<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ed's slice of life</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="map"></div>

  <header class="bar">
    <img class="brand-icon" src="assets/mascot.png" alt="" width="36" height="36" />
    <h1 class="brand">ed's <em>slice</em> of life</h1>
    <div class="bar-right">
      <div class="count" id="count"></div>
      <button type="button" class="suggest-btn" id="suggestBtn" aria-haspopup="dialog" aria-controls="suggestModal" aria-label="suggest a place" title="suggest a place">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="filter pizza spots">
    <button type="button" data-f="all" aria-pressed="true">everything</button>
    <button type="button" data-f="eaten" aria-pressed="false"><i class="swatch eaten"></i>eaten</button>
    <button type="button" data-f="totry" aria-pressed="false"><i class="swatch totry"></i>to try</button>
  </nav>

  <div class="geo-hint" id="geoHint" hidden></div>

  <section id="panel" role="dialog" aria-modal="false" aria-label="pizza spot details"></section>

  <div class="modal-backdrop" id="suggestBackdrop" hidden>
    <form id="suggestModal" class="suggest-modal" role="dialog" aria-modal="true" aria-label="suggest a place">
      <button class="close" type="button" id="suggestClose" aria-label="close">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-body">
        <div class="p-kick">suggest a place</div>
        <div class="field">
          <label for="suggestName">name of pizza place</label>
          <input type="text" id="suggestName" name="name" required maxlength="120" autocomplete="off" />
        </div>
        <div class="field">
          <label for="suggestLink">google maps link <span class="optional">(optional)</span></label>
          <input type="url" id="suggestLink" name="link" placeholder="https://www.google.com/maps/place/..." autocomplete="off" />
        </div>
        <div class="field">
          <label for="suggestNote">why? <span class="optional">(optional)</span></label>
          <textarea id="suggestNote" name="note" rows="3" maxlength="500"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="suggestCancel">cancel</button>
          <button type="submit" class="btn btn-primary">open email</button>
        </div>
      </div>
    </form>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
